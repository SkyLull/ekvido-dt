[tools]
uv = "latest"
python = "3.12"

[tasks.test]
description = "Python prototype tests"
run = "uv run --group test pytest tests/"

[tasks.lint]
description = "ruff lint + format check"
run = ["uv run --group test ruff check .", "uv run --group test ruff format --check ."]

[tasks.inject]
description = "Fetch darktable at the pinned tag into .dt/darktable and write the ekvido files over it"
run = "bash scripts/inject.sh"
run_windows = "scripts\\inject.cmd"

[tasks.deps]
description = "Install darktable build dependencies (Homebrew / apt / MSYS2 pacman; never upgrades others)"
depends = ["inject"]
dir = "{{config_root}}/.dt/darktable"
run = "bash packaging/ekvido/deps.sh"
run_windows = "packaging\\ekvido\\win.cmd deps"

[tasks.build]
description = "Build darktable with the ekvido modules and install it into this OS's prefix"
depends = ["inject"]
dir = "{{config_root}}/.dt/darktable"
run = "bash packaging/ekvido/build.sh"
run_windows = "packaging\\ekvido\\win.cmd build"

[tasks.test-c]
description = "Build and run the ekvido C core tests against the committed fixtures"
depends = ["inject"]
dir = "{{config_root}}/.dt/darktable"
run = "bash packaging/ekvido/test-core.sh"
run_windows = "packaging\\ekvido\\win.cmd test-core"

[tasks.test-cl]
description = "GPU-vs-CPU tests of the OpenCL path (needs an OpenCL GPU)"
depends = ["inject"]
dir = "{{config_root}}/.dt/darktable"
run = "bash packaging/ekvido/test-cl.sh"
run_windows = "packaging\\ekvido\\win.cmd test-cl"

[tasks.package]
description = "macOS app bundle / Windows installer (no-op on Linux)"
dir = "{{config_root}}/.dt/darktable"
run = "bash packaging/ekvido/package.sh"
run_windows = "packaging\\ekvido\\win.cmd package"

[tasks.install]
description = "Back up the darktable config and install the build for daily use"
dir = "{{config_root}}/.dt/darktable"
run = "bash packaging/ekvido/install.sh"
run_windows = "packaging\\ekvido\\win.cmd install"
